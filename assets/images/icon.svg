<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- Background Gradient: Deep Royal Blue to Midnight Slate -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="45%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <radialGradient id="centerGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#2563EB" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Top Gloss Sheen -->
    <linearGradient id="topGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- HERO GOLDEN ARROW GRADIENTS -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="20%" stop-color="#FEF08A"/>
      <stop offset="55%" stop-color="#FBBF24"/>
      <stop offset="85%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>

    <linearGradient id="goldDepth" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <!-- CORAL ARROW GRADIENTS -->
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDA4AF"/>
      <stop offset="40%" stop-color="#FB7185"/>
      <stop offset="80%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>

    <linearGradient id="coralDepth" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9F1239"/>
      <stop offset="100%" stop-color="#4C0519"/>
    </linearGradient>

    <!-- CYAN ARROW GRADIENTS -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="35%" stop-color="#38BDF8"/>
      <stop offset="80%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <linearGradient id="cyanDepth" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#075985"/>
      <stop offset="100%" stop-color="#0C4A6E"/>
    </linearGradient>

    <!-- SHINY SPECULAR HIGHLIGHT -->
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.15"/>
    </linearGradient>

    <!-- STAR SPARKLE GRADIENT -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#FACC15"/>
    </linearGradient>

    <!-- 3D SHADOW FILTERS -->
    <filter id="shadowHeavy" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="40" stdDeviation="32" flood-color="#080C16" flood-opacity="0.6"/>
    </filter>

    <filter id="shadowMedium" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#080C16" flood-opacity="0.45"/>
    </filter>

    <filter id="starGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#FDE047" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- SQUIRCLE BACKGROUND -->
  <rect width="1024" height="1024" fill="url(#bgGrad)"/>
  <rect width="1024" height="1024" fill="url(#centerGlow)"/>

  <!-- Speed Motion Trails Behind Hero Arrow -->
  <g stroke="#67E8F9" stroke-linecap="round" opacity="0.6" fill="none">
    <path d="M 136 800 C 220 800 320 760 380 640" stroke-width="28" stroke-dasharray="32 32"/>
    <path d="M 220 880 C 320 880 420 820 480 700" stroke-width="18" stroke-dasharray="24 28"/>
  </g>

  <!-- TANGLED ARROW 1: CYAN -->
  <g filter="url(#shadowMedium)">
    <path d="M 240 740 L 460 740 C 530 740 580 690 580 620 L 580 520"
          stroke="url(#cyanDepth)" stroke-width="96" stroke-linecap="round" stroke-linejoin="round" fill="none"
          transform="translate(0, 20)"/>
    <polygon points="580,420 490,550 670,550" fill="url(#cyanDepth)" transform="translate(0, 20)"/>

    <path d="M 240 740 L 460 740 C 530 740 580 690 580 620 L 580 520"
          stroke="url(#cyanGrad)" stroke-width="96" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <polygon points="580,420 490,550 670,550" fill="url(#cyanGrad)"/>

    <path d="M 260 720 L 460 720 C 510 720 556 676 556 620 L 556 540"
          stroke="#E0F2FE" stroke-width="20" stroke-linecap="round" fill="none" opacity="0.65"/>
  </g>

  <!-- TANGLED ARROW 2: CORAL PINK -->
  <g filter="url(#shadowMedium)">
    <path d="M 800 300 L 580 300 C 500 300 440 360 440 440 L 440 660"
          stroke="url(#coralDepth)" stroke-width="104" stroke-linecap="round" stroke-linejoin="round" fill="none"
          transform="translate(0, 24)"/>
    <polygon points="440,780 340,630 540,630" fill="url(#coralDepth)" transform="translate(0, 24)"/>

    <path d="M 800 300 L 580 300 C 500 300 440 360 440 440 L 440 660"
          stroke="url(#coralGrad)" stroke-width="104" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <polygon points="440,780 340,630 540,630" fill="url(#coralGrad)"/>

    <path d="M 780 280 L 580 280 C 484 280 416 348 416 440 L 416 600"
          stroke="#FFE4E6" stroke-width="20" stroke-linecap="round" fill="none" opacity="0.75"/>
  </g>

  <!-- HERO ESCAPING ARROW: GOLDEN AMBER -->
  <g filter="url(#shadowHeavy)">
    <path d="M 280 620 L 540 620 C 640 620 720 540 720 440 L 720 280"
          stroke="url(#goldDepth)" stroke-width="136" stroke-linecap="round" stroke-linejoin="round" fill="none"
          transform="translate(8, 32)"/>
    <polygon points="720,80 480,340 960,340" fill="url(#goldDepth)" transform="translate(8, 32)"/>

    <path d="M 280 620 L 540 620 C 640 620 720 540 720 440 L 720 280"
          stroke="url(#goldGrad)" stroke-width="136" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <polygon points="720,84 490,336 950,336" fill="url(#goldGrad)"/>

    <path d="M 304 592 L 540 592 C 644 592 692 528 692 436 L 692 280"
          stroke="url(#shineGrad)" stroke-width="32" stroke-linecap="round" fill="none"/>

    <polygon points="720,130 590,300 720,300" fill="#FFFFFF" opacity="0.5"/>
  </g>

  <!-- MAGICAL SPARKLES & STARS -->
  <g filter="url(#starGlow)" transform="translate(870, 170)">
    <path d="M 0 -72 Q 0 0 72 0 Q 0 0 0 72 Q 0 0 -72 0 Q 0 0 0 -72 Z" fill="url(#starGrad)"/>
    <circle cx="0" cy="0" r="14" fill="#FFFFFF"/>
  </g>

  <g filter="url(#starGlow)" transform="translate(190, 240) scale(0.7)">
    <path d="M 0 -64 Q 0 0 64 0 Q 0 0 0 64 Q 0 0 -64 0 Q 0 0 0 -64 Z" fill="url(#starGrad)"/>
    <circle cx="0" cy="0" r="12" fill="#FFFFFF"/>
  </g>

  <g filter="url(#starGlow)" transform="translate(850, 820) scale(0.55)">
    <path d="M 0 -56 Q 0 0 56 0 Q 0 0 0 56 Q 0 0 -56 0 Q 0 0 0 -56 Z" fill="url(#starGrad)"/>
  </g>

  <circle cx="720" cy="44" r="12" fill="#FEF08A" opacity="0.95"/>
  <circle cx="950" cy="360" r="10" fill="#FEF08A" opacity="0.85"/>
  <circle cx="150" cy="560" r="12" fill="#67E8F9" opacity="0.9"/>
  <circle cx="560" cy="920" r="12" fill="#FDE047" opacity="0.85"/>

  <!-- Top Glass Highlight -->
  <rect x="4" y="4" width="1016" height="480" fill="url(#topGloss)"/>
</svg>
